<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreshMart POS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d1117;
      --bg-panel: #161b22;
      --bg-card: #1c2128;
      --bg-hover: #262c36;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #2ea043;
      --accent-hover: #3fb950;
      --danger: #f85149;
      --warning: #d29922;
      --info: #58a6ff;
      --purple: #a371f7;
    }

    body {
      font-family: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-columns: 1fr 420px;
      height: 100vh;
    }

    .left-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-panel);
    }

    .topbar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #58a6ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #fff;
    }

    .brand-text h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .brand-text p {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .topbar-info {
      display: flex;
      gap: 22px;
      align-items: center;
    }

    .info-item {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .info-item .lbl {
      font-size: 10.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.7px;
      font-weight: 600;
    }

    .info-item .val {
      font-size: 14px;
      font-weight: 700;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .info-item .val.green { color: var(--accent); }

    .categories {
      padding: 14px 20px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--bg-panel);
    }

    .categories::-webkit-scrollbar { height: 4px; }
    .categories::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .cat-btn {
      padding: 9px 18px;
      border-radius: 22px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.15s;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .cat-btn:hover {
      background: var(--bg-hover);
      color: var(--text);
      border-color: #444c56;
    }

    .cat-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .cat-btn i { font-size: 13px; }

    .search-bar {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .search-box {
      position: relative;
      width: 100%;
    }

    .search-box input {
      width: 100%;
      padding: 11px 16px 11px 42px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: 0.15s;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(46, 160, 67, 0.15);
    }

    .search-box input::placeholder { color: var(--text-muted); }

    .search-box i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .products {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 14px;
      align-content: start;
    }

    .products::-webkit-scrollbar { width: 8px; }
    .products::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .product-card:hover {
      background: var(--bg-hover);
      border-color: #444c56;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    }

    .product-card:active {
      transform: scale(0.98);
    }

    .product-emoji {
      font-size: 40px;
      text-align: center;
      margin-bottom: 10px;
      line-height: 1;
    }

    .product-name {
      font-size: 13.5px;
      font-weight: 600;
      margin-bottom: 3px;
      line-height: 1.3;
      color: var(--text);
    }

    .product-unit {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-bottom: 9px;
    }

    .product-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }

    .product-price {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .stock-badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 5px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .stock-ok { background: rgba(46, 160, 67, 0.15); color: #3fb950; }
    .stock-low { background: rgba(210, 153, 34, 0.15); color: var(--warning); }
    .stock-out { background: rgba(248, 81, 73, 0.15); color: var(--danger); }

    .product-card.out-of-stock {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .product-card.out-of-stock:hover {
      transform: none;
      box-shadow: none;
    }

    .right-panel {
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .cart-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .cart-header h2 {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .cart-header h2 i { color: var(--accent); }

    .cart-count {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 9px;
      font-weight: 700;
    }

    .clear-cart-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: 0.15s;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .clear-cart-btn:hover {
      background: rgba(248, 81, 73, 0.1);
      color: var(--danger);
      border-color: rgba(248, 81, 73, 0.3);
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
    }

    .cart-items::-webkit-scrollbar { width: 6px; }
    .cart-items::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .cart-empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .cart-empty i {
      font-size: 46px;
      margin-bottom: 14px;
      opacity: 0.3;
      display: block;
    }

    .cart-empty h3 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 5px;
    }

    .cart-empty p {
      font-size: 12.5px;
      line-height: 1.5;
    }

    .cart-item {
      display: flex;
      gap: 12px;
      padding: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 8px;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(12px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .cart-item-emoji {
      font-size: 28px;
      line-height: 1;
      flex-shrink: 0;
    }

    .cart-item-info {
      flex: 1;
      min-width: 0;
    }

    .cart-item-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .cart-item-price {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .cart-item-price strong {
      color: var(--accent);
      font-weight: 700;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .qty-btn {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      transition: 0.12s;
      font-family: inherit;
    }

    .qty-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .qty-value {
      font-size: 13px;
      font-weight: 700;
      min-width: 22px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .cart-item-remove {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13px;
      padding: 4px;
      align-self: flex-start;
      transition: 0.15s;
      border-radius: 5px;
    }

    .cart-item-remove:hover {
      color: var(--danger);
      background: rgba(248, 81, 73, 0.1);
    }

    .cart-item-line-total {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      align-self: flex-end;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .cart-summary {
      border-top: 1px solid var(--border);
      padding: 16px 20px;
      flex-shrink: 0;
      background: var(--bg-card);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 5px 0;
      color: var(--text-muted);
    }

    .summary-row .val {
      color: var(--text);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .summary-row.discount .val { color: var(--accent); }

    .summary-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      margin-top: 8px;
      border-top: 1px solid var(--border);
    }

    .summary-total .lbl {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .summary-total .val {
      font-size: 26px;
      font-weight: 800;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.5px;
    }

    .cart-actions {
      padding: 14px 20px 18px;
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 10px;
      flex-shrink: 0;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
    }

    .action-btn {
      border: none;
      border-radius: 11px;
      padding: 15px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.15s;
    }

    .btn-hold {
      background: var(--bg-hover);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-hold:hover {
      background: #30363d;
      border-color: #444c56;
    }

    .btn-pay {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 14px rgba(46, 160, 67, 0.35);
    }

    .btn-pay:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(46, 160, 67, 0.45);
    }

    .btn-pay:disabled {
      background: #30363d;
      color: var(--text-muted);
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 30px 70px rgba(0,0,0,0.7);
      animation: modalIn 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes modalIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-header {
      text-align: center;
      margin-bottom: 22px;
    }

    .modal-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(46, 160, 67, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: var(--accent);
      margin: 0 auto 14px;
    }

    .modal-header h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .modal-header p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .modal-total {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      margin-bottom: 20px;
    }

    .modal-total .lbl {
      font-size: 11.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .modal-total .val {
      font-size: 34px;
      font-weight: 800;
      color: var(--accent);
      margin-top: 6px;
      font-variant-numeric: tabular-nums;
      letter-spacing: -1px;
    }

    .payment-methods {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 22px;
    }

    .pay-method {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 14px 10px;
      cursor: pointer;
      text-align: center;
      transition: 0.15s;
      font-family: inherit;
      color: var(--text-muted);
    }

    .pay-method:hover {
      border-color: #444c56;
      background: var(--bg-hover);
    }

    .pay-method.active {
      border-color: var(--accent);
      background: rgba(46, 160, 67, 0.1);
      color: var(--accent);
    }

    .pay-method i {
      font-size: 20px;
      display: block;
      margin-bottom: 6px;
    }

    .pay-method span {
      font-size: 11.5px;
      font-weight: 600;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .modal-actions .action-btn { padding: 14px; }

    .btn-cancel {
      background: var(--bg-hover);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-cancel:hover { background: #30363d; }

    .receipt {
      display: none;
    }

    .receipt.active { display: block; }

    .receipt-title {
      text-align: center;
      margin-bottom: 20px;
    }

    .receipt-title h2 {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .receipt-title p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .receipt-items {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 16px;
      max-height: 200px;
      overflow-y: auto;
    }

    .receipt-item {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      padding: 5px 0;
      color: var(--text-muted);
    }

    .receipt-item .val {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .receipt-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
      background: rgba(46, 160, 67, 0.1);
      border: 1px solid rgba(46, 160, 67, 0.3);
      border-radius: 10px;
      margin-bottom: 18px;
    }

    .receipt-total .lbl {
      font-size: 13px;
      font-weight: 600;
    }

    .receipt-total .val {
      font-size: 22px;
      font-weight: 800;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .toast {
      position: fixed;
      top: 24px;
      right: 24px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 11px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
      transform: translateX(400px);
      opacity: 0;
      transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 2000;
      font-size: 13.5px;
      font-weight: 500;
      max-width: 340px;
    }

    .toast.show {
      transform: translateX(0);
      opacity: 1;
    }

    .toast i { color: var(--accent); font-size: 16px; }
    .toast.danger { border-left-color: var(--danger); }
    .toast.danger i { color: var(--danger); }
    .toast.warning { border-left-color: var(--warning); }
    .toast.warning i { color: var(--warning); }

    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr 340px; }
      .products { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    }

    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; }
      .right-panel {
        position: fixed;
        inset: 0;
        z-index: 500;
        transform: translateY(100%);
        transition: transform 0.3s ease;
      }
      .right-panel.open { transform: translateY(0); }
      .topbar-info { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="left-panel">
      <div class="topbar">
        <div class="brand">
          <div class="brand-icon"><i class="fas fa-store"></i></div>
          <div class="brand-text">
            <h1>FreshMart POS</h1>
            <p>Terminal #03 · Cashier: Jane D.</p>
          </div>
        </div>
        <div class="topbar-info">
          <div class="info-item">
            <span class="lbl">Register</span>
            <span class="val">#03</span>
          </div>
          <div class="info-item">
            <span class="lbl">Shift</span>
            <span class="val">Morning</span>
          </div>
          <div class="info-item">
            <span class="lbl">Time</span>
            <span class="val green" id="clock">00:00:00</span>
          </div>
        </div>
      </div>

      <div class="categories" id="categories">
        <button class="cat-btn active" data-cat="all"><i class="fas fa-th"></i> All</button>
        <button class="cat-btn" data-cat="fruit"><i class="fas fa-apple-alt"></i> Fruits</button>
        <button class="cat-btn" data-cat="veg"><i class="fas fa-carrot"></i> Vegetables</button>
        <button class="cat-btn" data-cat="dairy"><i class="fas fa-cheese"></i> Dairy</button>
        <button class="cat-btn" data-cat="meat"><i class="fas fa-drumstick-bite"></i> Meat</button>
        <button class="cat-btn" data-cat="bakery"><i class="fas fa-bread-slice"></i> Bakery</button>
        <button class="cat-btn" data-cat="drinks"><i class="fas fa-wine-bottle"></i> Drinks</button>
        <button class="cat-btn" data-cat="snacks"><i class="fas fa-cookie-bite"></i> Snacks</button>
      </div>

      <div class="search-bar">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Search products by name or barcode...">
        </div>
      </div>

      <div class="products" id="products"></div>
    </div>

    <div class="right-panel" id="rightPanel">
      <div class="cart-header">
        <h2><i class="fas fa-shopping-cart"></i> Cart <span class="cart-count" id="cartCount">0</span></h2>
        <button class="clear-cart-btn" id="clearCartBtn"><i class="fas fa-trash-alt"></i> Clear</button>
      </div>

      <div class="cart-items" id="cartItems"></div>

      <div class="cart-summary">
        <div class="summary-row">
