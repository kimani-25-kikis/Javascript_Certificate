<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Serpent</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #050608;
      --bg-panel: #0a0d12;
      --bg-sunken: #040507;
      --border: #141a24;
      --border-bright: #1e2733;
      --text: #d8e4ec;
      --text-mid: #7e8c9b;
      --text-dim: #4a5563;
      --neon: #39ff88;
      --neon-dim: #1f9e52;
      --neon-glow: rgba(57, 255, 136, 0.55);
      --food: #ff3d6e;
      --food-glow: rgba(255, 61, 110, 0.6);
      --cyan: #45d6ff;
      --amber: #ffb24a;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background-image:
        radial-gradient(ellipse at 50% -20%, rgba(57, 255, 136, 0.07), transparent 55%),
        radial-gradient(ellipse at 50% 120%, rgba(69, 214, 255, 0.05), transparent 55%);
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(57, 255, 136, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(57, 255, 136, 0.015) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
      z-index: 0;
    }

    .rail {
      flex-shrink: 0;
      padding: 12px 22px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      position: relative;
      z-index: 2;
    }

    .mark {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .mark-glyph {
      width: 34px;
      height: 34px;
      border: 1px solid var(--neon-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 0 12px rgba(57, 255, 136, 0.25), inset 0 0 10px rgba(57, 255, 136, 0.1);
    }

    .mark-glyph svg {
      width: 18px;
      height: 18px;
      fill: var(--neon);
      filter: drop-shadow(0 0 4px var(--neon-glow));
    }

    .mark-text strong {
      font-size: 13.5px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--neon);
      text-shadow: 0 0 8px var(--neon-glow);
      display: block;
      font-weight: 800;
    }

    .mark-text small {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 1px;
      display: block;
    }

    .rail-divider {
      width: 1px;
      height: 26px;
      background: var(--border);
    }

    .difficulty {
      display: flex;
      gap: 3px;
      background: var(--bg-sunken);
      border: 1px solid var(--border);
      padding: 3px;
    }

    .diff-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      padding: 7px 15px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      transition: 0.15s;
      position: relative;
    }

    .diff-btn:hover {
      color: var(--text);
    }

    .diff-btn.on {
      color: var(--neon);
      background: rgba(57, 255, 136, 0.08);
      text-shadow: 0 0 6px var(--neon-glow);
    }

    .diff-btn.on::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -1px;
      transform: translateX(-50%);
      width: 60%;
      height: 2px;
      background: var(--neon);
      box-shadow: 0 0 8px var(--neon-glow);
    }

    .rail-tail {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .stat-block {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
    }

    .stat-block .lbl {
      font-size: 9.5px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--text-dim);
      font-weight: 700;
    }

    .stat-block .val {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
    }

    .stat-block .val.neon {
      color: var(--neon);
      text-shadow: 0 0 8px var(--neon-glow);
    }

    .stat-block .val.amber {
      color: var(--amber);
      text-shadow: 0 0 8px rgba(255, 178, 74, 0.5);
    }

    .icon-btn {
      background: var(--bg-sunken);
      border: 1px solid var(--border);
      color: var(--text-mid);
      width: 34px;
      height: 34px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.15s;
    }

    .icon-btn:hover {
      color: var(--text);
      border-color: var(--border-bright);
      background: #0e1218;
    }

    .icon-btn.off {
      color: var(--text-dim);
      opacity: 0.5;
    }

    .icon-btn svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-height: 0;
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    .arena {
      position: relative;
      background: var(--bg-sunken);
      border: 1px solid var(--border);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.5),
        0 0 40px rgba(57, 255, 136, 0.06),
        inset 0 0 60px rgba(0,0,0,0.6);
      padding: 12px;
    }

    .arena::before,
    .arena::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      border: 1px solid var(--neon-dim);
      pointer-events: none;
      box-shadow: 0 0 8px rgba(57, 255, 136, 0.3);
    }

    .arena::before {
      top: 4px;
      left: 4px;
      border-right: none;
      border-bottom: none;
    }

    .arena::after {
      bottom: 4px;
      right: 4px;
      border-left: none;
      border-top: none;
    }

    canvas {
      display: block;
      background: #020304;
      image-rendering: pixelated;
      width: 100%;
      height: auto;
      max-width: 560px;
    }

    .arena-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 2px 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .arena-meta .seg {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .arena-meta .seg .dot {
      width: 6px;
      height: 6px;
      background: var(--neon);
      box-shadow: 0 0 6px var(--neon-glow);
    }

    .arena-meta .seg .dot.food {
      background: var(--food);
      box-shadow: 0 0 6px var(--food-glow);
    }

    .overlay {
      position: absolute;
      inset: 12px;
      background: rgba(2, 3, 4, 0.88);
      backdrop-filter: blur(3px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      z-index: 10;
      transition: opacity 0.25s;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay-mark {
      width: 54px;
      height: 54px;
      border: 1px solid var(--neon-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 0 20px rgba(57, 255, 136, 0.3), inset 0 0 15px rgba(57, 255, 136, 0.1);
    }

    .overlay-mark svg {
      width: 26px;
      height: 26px;
      fill: var(--neon);
      filter: drop-shadow(0 0 6px var(--neon-glow));
    }

    .overlay h2 {
      font-size: 20px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--neon);
      text-shadow: 0 0 12px var(--neon-glow);
      font-weight: 800;
      margin-bottom: 8px;
    }

    .overlay p {
      font-size: 12.5px;
      color: var(--text-mid);
      letter-spacing: 0.4px;
      line-height: 1.6;
      max-width: 320px;
      margin-bottom: 22px;
    }

    .overlay .score-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 40px;
      font-weight: 800;
      color: var(--neon);
      text-shadow: 0 0 20px var(--neon-glow);
      letter-spacing: 2px;
      margin-bottom: 4px;
      line-height: 1;
    }

    .overlay .score-label {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-dim);
      font-weight: 700;
      margin-bottom: 24px;
    }

    .overlay .best-row {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--amber);
      letter-spacing: 1.5px;
      margin-bottom: 22px;
      text-shadow: 0 0 8px rgba(255, 178, 74, 0.4);
    }

    .btn {
      background: transparent;
      border: 1px solid var(--neon-dim);
      color: var(--neon);
      padding: 12px 28px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.15s;
      position: relative;
      text-shadow: 0 0 6px var(--neon-glow);
    }

    .btn:hover {
      background: rgba(57, 255, 136, 0.08);
      box-shadow: 0 0 20px rgba(57, 255, 136, 0.3), inset 0 0 20px rgba(57, 255, 136, 0.05);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-ghost {
      border-color: var(--border-bright);
      color: var(--text-mid);
      text-shadow: none;
    }

    .btn-ghost:hover {
      color: var(--text);
      background: rgba(255,255,255,0.03);
      box-shadow: none;
    }

    .overlay-actions {
      display: flex;
      gap: 10px;
    }

    .hint-strip {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 22px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 1px;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 3;
    }

    .hint-strip .key {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .hint-strip .key svg {
      width: 12px;
      height: 12px;
      fill: var(--text-dim);
    }

    .status-strip {
      flex-shrink: 0;
      padding: 8px 22px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 22px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-dim);
      z-index: 2;
      position: relative;
      flex-wrap: wrap;
    }

    .status-strip .st {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-strip .st strong {
      color: var(--text-mid);
      font-weight: 600;
    }

    .status-strip .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--neon);
      box-shadow: 0 0 8px var(--neon-glow);
      animation: pulse 1.6s ease-in-out infinite;
    }

    .status-strip .pulse-dot.paused {
      background: var(--text-dim);
      box-shadow: none;
      animation: none;
    }

    .status-strip .pulse-dot.dead {
      background: var(--food);
      box-shadow: 0 0 8px var(--food-glow);
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .toast {
      position: fixed;
      bottom: 44px;
      left: 50%;
      transform: translate(-50%, 60px);
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-left: 3px solid var(--neon);
      padding: 11px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
      opacity: 0;
      transition: 0.3s cubic-bezier(0.34, 1.4, 0.5, 1);
      z-index: 100;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      pointer-events: none;
      max-width: 320px;
    }

    .toast.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    .toast svg {
      width: 13px;
      height: 13px;
      fill: var(--neon);
      flex-shrink: 0;
    }

    .toast.warn {
      border-left-color: var(--food);
    }

    .toast.warn svg {
      fill: var(--food);
    }

    .audio-toggle-wrap {
      position: relative;
    }

    .audio-toggle-wrap .bar {
      position: absolute;
      top: 50%;
      left: 4px;
      right: 4px;
      height: 1px;
      background: var(--food);
      transform: rotate(-45deg);
      opacity: 0.85;
      pointer-events: none;
    }

    @media (max-width: 720px) {
      .rail {
        padding: 10px 14px;
        gap: 12px;
      }
      .rail-divider { display: none; }
      .mark-text small { display: none; }
      .rail-tail {
        width: 100%;
        margin-left: 0;
        justify-content: space-between;
      }
      .stat-block .val { font-size: 14px; }
      .stat-block .lbl { font-size: 8.5px; letter-spacing: 1.2px; }
      .stage { padding: 12px; }
      .arena { padding: 8px; }
      .overlay { inset: 8px; padding: 20px; }
      .overlay h2 { font-size: 17px; letter-spacing: 3px; }
      .overlay .score-display { font-size: 32px; }
      .hint-strip { display: none; }
      .status-strip { padding: 6px 14px; gap: 14px; font-size: 9.5px; }
    }

    @media (max-width: 460px) {
      .diff-btn { padding: 6px 9px; font-size: 10px; letter-spacing: 0.8px; }
      .icon-btn { width: 30px; height: 30px; }
      .mark-glyph { width: 30px; height: 30px; }
      .mark-text strong { font-size: 12px; letter-spacing: 2px; }
    }
  </style>
</head>
<body>

  <header class="rail">
    <div class="mark">
      <div class="mark-glyph">
        <svg viewBox="0 0 24 24"><path d="M4 14h4v2H4zM8 12h4v2H8zM12 10h4v2h-4zM16 8h4v2h-4zM16 14h4v2h-4zM12 16h4v2h-4zM6 16h4v2H6z"/></svg>
      </div>
      <div class="mark-text">
        <strong>Neon Serpent</strong>
        <small>Grid Protocol</small>
      </div>
    </div>

    <div class="rail-divider"></div>

    <div class="difficulty" id="difficulty">
      <button class="diff-btn" data-speed="120">Drift</button>
      <button class="diff-btn on" data-speed="90">Cruise</button>
      <button class="diff-btn" data-speed="62">Surge</button>
      <button class="diff-btn" data-speed="40">Overdrive</button>
    </div>

    <div class="rail-tail">
      <div class="stat-block">
        <span class="lbl">Score</span>
        <span class="val neon" id="statScore">0</span>
      </div>
      <div class="stat-block">
        <span class="lbl">Best</span>
        <span class="val amber" id="statBest">0</span>
      </div>
      <div class="stat-block">
        <span class="lbl">Length</span>
        <span class="val" id="statLength">3</span>
      </div>

      <div class="audio-toggle-wrap">
        <button class="icon-btn" id="btnSound" title="Toggle sound">
          <svg viewBox="0 0 24 24" id="soundIcon"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
        </button>
        <div class="bar" id="soundBar" style="display:none;"></div>
      </div>

      <button class="icon-btn" id="btnPause" title="Pause / Resume">
        <svg viewBox="0 0 24 24" id="pauseIcon"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
    </div>
  </header>

  <main class="stage">
    <div class="arena" id="arena">
      <canvas id="gameCanvas" width="560" height="560"></canvas>

      <div class="overlay" id="overlay">
        <div class="overlay-mark">
          <svg viewBox="0 0 24 24"><path d="M4 14h4v2H4zM8 12h4v2H8zM12 10h4v2h-4zM16 8h4v2h-4z"/></svg>
        </div>
        <h2 id="overlayTitle">Neon Serpent</h2>
        <p id="overlayText">Guide the serpent. Feed on the crimson nodes. Do not touch the walls or your own tail.</p>
        <div class="best-row" id="overlayBest" style="display:none;">BEST — 0</div>
        <div class="overlay-actions">
          <button class="btn" id="btnStart">Engage</button>
        </div>
      </div>

      <div class="arena-meta">
        <div class="seg"><span class="dot"></span>Serpent Active</div>
        <div class="seg"><span class="dot food"></span>Food Node</div>
      </div>
    </div>

    <div class="hint-strip">
      <span class="key">
        <svg viewBox="0 0 24 24"><path d="M7 10l5-5 5 5z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M7 14l5 5 5-5z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M10 7l-5 5 5 5z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M14 7l5 5-5 5z"/></svg>
        Arrow keys / WASD
      </span>
      <span class="key">P pause</span>
      <span class="key">R restart</span>
    </div>
  </main>

  <footer class="status-strip">
    <div class="st"><span class="pulse-dot" id="statusDot"></span><strong id="statusMode">Idle</strong></div>
    <div class="st">speed <strong id="statusSpeed">90ms</strong></div>
    <div class="st">cells <strong id="statusCells">0</strong></div>
    <div class="st">best <strong id="statusBest">0</strong></div>
  </footer>

  <div class="toast" id="toast">
    <svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
    <span id="toastText">Ready</span>
  </div>

  <script>
    (function () {
      var STORAGE_BEST = 'neon-serpent-best';

      var COLS = 28;
      var ROWS = 28;
      var CELL = 20;

      var SPEEDS = {
        slow: 120,
        normal: 90,
        fast: 62,
        insane: 40
      };

      var state = {
        snake: [],
        dir: { x: 1, y: 0 },
        nextDir: { x: 1, y: 0 },
        food: { x: 0, y: 0 },
        foodPulse: 0,
        score: 0,
        best: 0,
        running: false,
        paused: false,
        dead: false,
        speed: SPEEDS.normal,
        lastStep: 0,
        accumulator: 0,
        interp: 0,
        particles: [],
        trail: [],
        shakeT: 0,
        soundOn: true,
        audioCtx: null
      };

      var canvas = document.getElementById('gameCanvas');
      var ctx = canvas.getContext('2d');

      var el = {
        overlay: document.getElementById('overlay'),
        overlayTitle: document.getElementById('overlayTitle'),
        overlayText: document.getElementById('overlayText'),
        overlayBest: document.getElementById('overlayBest'),
        btnStart: document.getElementById('btnStart'),
        statScore: document.getElementById('statScore'),
        statBest: document.getElementById('statBest'),
        statLength: document.getElementById('statLength'),
        statusDot: document.getElementById('statusDot'),
        statusMode: document.getElementById('statusMode'),
        statusSpeed: document.getElementById('statusSpeed'),
        statusCells: document.getElementById('statusCells'),
        statusBest: document.getElementById('statusBest'),
        difficulty: document.getElementById('difficulty'),
        btnPause: document.getElementById('btnPause'),
        pauseIcon: document.getElementById('pauseIcon'),
        btnSound: document.getElementById('btnSound'),
        soundIcon: document.getElementById('soundIcon'),
        soundBar: document.getElementById('soundBar'),
        toast: document.getElementById('toast'),
        toastText: document.getElementById('toastText')
      };

      var dpr = Math.min(window.devicePixelRatio || 1, 2);

      function setupCanvas() {
        var cssSize = Math.min(560, Math.floor(Math.min(window.innerWidth - 72, window.innerHeight - 220)));
        cssSize = Math.max(280, cssSize);
        cssSize = Math.floor(cssSize / COLS) * COLS;

        canvas.style.width = cssSize + 'px';
        canvas.style.height = cssSize + 'px';
        CELL = cssSize / COLS;

        canvas.width = cssSize * dpr;
        canvas.height = cssSize * dpr;

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.imageSmoothingEnabled = false;
      }

      function resetGame() {
        state.snake = [
          { x: 8, y: 14 },
          { x: 7, y: 14 },
          { x: 6, y: 14 }
        ];
        state.dir = { x: 1, y: 0 };
        state.nextDir = { x: 1, y: 0 };
        state.score = 0;
        state.dead = false;
        state.paused = false;
        state.accumulator = 0;
        state.interp = 0;
        state.particles = [];
        state.trail = [];
        state.shakeT = 0;
        spawnFood();
        updateHUD();
      }

      function spawnFood() {
        var free = [];
        for (var y = 0; y < ROWS; y++) {
          for (var x = 0; x < COLS; x++) {
            var occupied = false;
            for (var i = 0; i < state.snake.length; i++) {
              if (state.snake[i].x === x && state.snake[i].y === y) {
                occupied = true;
                break;
              }
            }
            if (!occupied) free.push({ x: x, y: y });
          }
        }
        if (free.length === 0) return;
        var pick = free[Math.floor(Math.random() * free.length)];
        state.food = pick;
        state.foodPulse = 0;
      }

      function playTone(freq, dur, type, gain) {
        if (!state.soundOn) return;
        if (!state.audioCtx) {
          try {
            state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          } catch (e) { return; }
        }
        var a = state.audioCtx;
        if (a.state === 'suspended') a.resume();
        var osc = a.createOscillator();
        var g = a.createGain();
        osc.type = type || 'square';
        osc.frequency.value = freq;
        g.gain.value = 0;
        g.gain.linearRampToValueAtTime(gain || 0.05, a.currentTime + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
        osc.connect(g);
        g.connect(a.destination);
        osc.start();
        osc.stop(a.currentTime + dur + 0.02);
      }

      function playEat() {
        playTone(660, 0.06, 'square', 0.05);
        setTimeout(function () { playTone(880, 0.09, 'square', 0.05); }, 55);
      }

      function playDeath() {
        playTone(220, 0.14, 'sawtooth', 0.06);
        setTimeout(function () { playTone(160, 0.18, 'sawtooth', 0.06); }, 120);
        setTimeout(function () { playTone(110, 0.24, 'sawtooth', 0.06); }, 260);
      }

      function playTurn() {
        playTone(440, 0.03, 'sine', 0.02);
      }

      function burst(x, y, color, count) {
        for (var i = 0; i < count; i++) {
          var angle = Math.random() * Math.PI * 2;
          var speed = 0.4 + Math.random() * 1.6;
          state.particles.push({
            x: x * CELL + CELL / 2,
            y: y * CELL + CELL / 2,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            decay: 0.018 + Math.random() * 0.02,
            size: 1.2 + Math.random() * 2.4,
            color: color
          });
        }
      }

      function step() {
        state.dir = state.nextDir;

        var head = state.snake[0];
        var nextHead = {
          x: head.x + state.dir.x,
          y: head.y + state.dir.y
        };

        if (nextHead.x < 0 || nextHead.x >= COLS || nextHead.y < 0 || nextHead.y >= ROWS) {
          die();
          return;
        }

        for (var i = 0; i < state.snake.length - 1; i++) {
          if (state.snake[i].x === nextHead.x && state.snake[i].y === nextHead.y) {
            die();
            return;
          }
        }

        var ate = (nextHead.x === state.food.x && nextHead.y === state.food.y);

        state.trail.push({
          x: state.snake[state.snake.length - 1].x,
          y: state.snake[state.snake.length - 1].y,
          life: 1
        });

        state.snake.unshift(nextHead);

        if (ate) {
          state.score += 10;
          if (state.score > state.best) {
            state.best = state.score;
            try { localStorage.setItem(STORAGE_BEST, String(state.best)); } catch (e) {}
          }
          burst(state.food.x, state.food.y, '#ff3d6e', 22);
          playEat();
          spawnFood();
        } else {
          state.snake.pop();
        }

        updateHUD();
      }

      function die() {
        state.dead = true;
        state.running = false;
        state.shakeT = 1;
        burst(state.snake[0].x, state.snake[0].y, '#39ff88', 30);
        playDeath();
        showOverlay(
          'Signal Lost',
          'The serpent has fallen. Score ' + state.score + '.',
          'Rekindle'
        );
        el.overlayBest.style.display = 'block';
        el.overlayBest.textContent = 'BEST — ' + state.best;
        updateStatus();
      }

      function updateHUD() {
        el.statScore.textContent = state.score;
        el.statBest.textContent = state.best;
        el.statLength.textContent = state.snake.length;
        el.statusCells.textContent = state.snake.length;
        el.statusBest.textContent = state.best;
        el.statusSpeed.textContent = state.speed + 'ms';
      }

      function updateStatus() {
        var dot = el.statusDot;
        dot.classList.remove('paused', 'dead');
        if (state.dead) {
          dot.classList.add('dead');
          el.statusMode.textContent = 'Terminated';
        } else if (state.paused) {
          dot.classList.add('paused');
          el.statusMode.textContent = 'Paused';
        } else if (state.running) {
          el.statusMode.textContent = 'Engaged';
        } else {
          el.statusMode.textContent = 'Idle';
        }

        el.pauseIcon.innerHTML = state.paused
          ? '<path d="M7 4v16l13-8z"/>'
          : '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
      }

      function drawGrid() {
        ctx.fillStyle = '#020304';
        ctx.fillRect(0, 0, COLS * CELL, ROWS * CELL);

        ctx.strokeStyle = 'rgba(57, 255, 136, 0.045)';
        ctx.lineWidth = 1;
        for (var i = 0; i <= COLS; i++) {
          ctx.beginPath();
          ctx.moveTo(i * CELL + 0.5, 0);
          ctx.lineTo(i * CELL + 0.5, ROWS * CELL);
          ctx.stroke();
        }
        for (var j = 0; j <= ROWS; j++) {
          ctx.beginPath();
          ctx.moveTo(0, j * CELL + 0.5);
          ctx.lineTo(COLS * CELL, j * CELL + 0.5);
          ctx.stroke();
        }
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function getInterpolatedSnake() {
        var pts = [];
        for (var i = 0; i < state.snake.length; i++) {
          var seg = state.snake[i];
          var prev = i === 0 ? state.snake[1] : state.snake[i - 1];
          if (!prev) {
            pts.push({ x: seg.x * CELL + CELL / 2, y: seg.y * CELL + CELL / 2 });
            continue;
          }
        }
        return pts;
      }

      function drawSnake() {
        var t = Math.min(1, state.interp);
        var pts = [];

        for (var i = 0; i < state.snake.length; i++) {
          var seg = state.snake[i];
          var px = seg.x * CELL + CELL / 2;
          var py = seg.y * CELL + CELL / 2;

          if (i === 0 && state.running) {
            var backX = px - state.dir.x * CELL;
            var backY = py - state.dir.y * CELL;
            px = lerp(backX, px, t);
            py = lerp(backY, py, t);
          } else {
            var prevSeg = state.snake[i - 1];
            if (prevSeg) {
              var ppX = prevSeg.x * CELL + CELL / 2;
              var ppY = prevSeg.y * CELL + CELL / 2;
              px = lerp(px, ppX, t);
              py = lerp(py, ppY, t);
            }
          }

          pts.push({ x: px, y: py });
        }

        if (pts.length === 0) return;

        ctx.save();
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.shadowColor = 'rgba(57, 255, 136, 0.7)';
        ctx.shadowBlur = 22;

        ctx.strokeStyle = 'rgba(57, 255, 136, 0.35)';
        ctx.lineWidth = CELL * 0.7;
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (var a = 1; a < pts.length; a++) {
          ctx.lineTo(pts[a].x, pts[a].y);
        }
        ctx.stroke();

        ctx.shadowBlur = 10;
        ctx.strokeStyle = '#39ff88';
        ctx.lineWidth = CELL * 0.44;
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (var b = 1; b < pts.length; b++) {
          ctx.lineTo(pts[b].x, pts[b].y);
        }
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(200, 255, 220, 0.85)';
        ctx.lineWidth = Math.max(1, CELL * 0.1);
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (var c = 1; c < pts.length; c++) {
          ctx.lineTo(pts[c].x, pts[c].y);
        }
        ctx.stroke();

        ctx.restore();

        var head = pts[0];
        ctx.save();
        ctx.shadowColor = 'rgba(57, 255, 136, 0.9)';
        ctx.shadowBlur = 24;
        ctx.fillStyle = '#eafff0';
        ctx.beginPath();
        ctx.arc(head.x, head.y, CELL * 0.24, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        var eyeOffX = state.dir.x * CELL * 0.14;
        var eyeOffY = state.dir.y * CELL * 0.14;
        var perpX = -state.dir.y * CELL * 0.13;
        var perpY = state.dir.x * CELL * 0.13;

        ctx.fillStyle = '#050608';
        ctx.beginPath();
        ctx.arc(head.x + eyeOffX + perpX, head.y + eyeOffY + perpY, CELL * 0.055, 0, Math.PI * 2);
        ctx.arc(head.x + eyeOffX - perpX, head.y + eyeOffY - perpY, CELL * 0.055, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawFood() {
        var fx = state.food.x * CELL + CELL / 2;
        var fy = state.food.y * CELL + CELL / 2;
        state.foodPulse += 0.08;
        var pulse = 0.5 + 0.5 * Math.sin(state.foodPulse);
        var r = CELL * (0.28 + pulse * 0.08);

        ctx.save();
        ctx.shadowColor = 'rgba(255, 61, 110, 0.8)';
        ctx.shadowBlur = 28;

        ctx.fillStyle = 'rgba(255, 61, 110, 0.25)';
        ctx.beginPath();
        ctx.arc(fx, fy, r * 1.9, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 14;
        ctx.fillStyle = '#ff3d6e';
        ctx.beginPath();
        ctx.arc(fx, fy, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffe0e8';
        ctx.beginPath();
        ctx.arc(fx, fy, r * 0.42, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawTrail() {
        for (var i = 0; i < state.trail.length; i++) {
          var t = state.trail[i];
          ctx.save();
          ctx.globalAlpha = t.life * 0.35;
          ctx.shadowColor = 'rgba(57, 255, 136, 0.6)';
          ctx.shadowBlur = 12;
          ctx.fillStyle = '#39ff88';
          var size = CELL * 0.3 * t.life;
          ctx.fillRect(
            t.x * CELL + CELL / 2 - size / 2,
            t.y * CELL + CELL / 2 - size / 2,
            size, size
          );
          ctx.restore();
        }
      }

      function drawParticles() {
        for (var i = 0; i < state.particles.length; i++) {
          var p = state.particles[i];
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 10;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
          ctx.restore();
        }
      }

      function draw() {
        var shake = state.shakeT > 0 ? state.shakeT : 0;
        ctx.save();
        if (shake > 0) {
          var mag = shake * 6;
          ctx.translate(
            (Math.random() - 0.5) * mag,
            (Math.random() - 0.5) * mag
          );
        }

        drawGrid();
        drawTrail();
        drawFood();
        drawSnake();
        drawParticles();

        ctx.restore();

        ctx.save();
        ctx.strokeStyle = state.dead
          ? 'rgba(255, 61, 110, 0.55)'
          : (state.running ? 'rgba(57, 255, 136, 0.45)' : 'rgba(57, 255, 136, 0.15)');
        ctx.lineWidth = 2;
        ctx.shadowColor = ctx.strokeStyle;
        ctx.shadowBlur = 14;
        ctx.strokeRect(1, 1, COLS * CELL - 2, ROWS * CELL - 2);
        ctx.restore();
      }

      function update(dt) {
        if (!state.running || state.paused) {
          state.interp = 0;
          for (var i = state.trail.length - 1; i >= 0; i--) {
            state.trail[i].life -= dt * 0.0035;
            if (state.trail[i].life <= 0) state.trail.splice(i, 1);
          }
          for (var p = state.particles.length - 1; p >= 0; p--) {
            var pt = state.particles[p];
            pt.x += pt.vx * dt * 0.06;
            pt.y += pt.vy * dt * 0.06;
            pt.vx *= 0.965;
            pt.vy *= 0.965;
            pt.life -= pt.decay * (dt * 0.06);
            if (pt.life <= 0) state.particles.splice(p, 1);
          }
          if (state.shakeT > 0) {
            state.shakeT -= dt * 0.002;
            if (state.shakeT < 0) state.shakeT = 0;
          }
          return;
        }

        state.accumulator += dt;
        state.interp = state.accumulator / state.speed;

        while (state.accumulator >= state.speed) {
          state.accumulator -= state.speed;
          step();
          if (state.dead) break;
        }

        state.interp = Math.min(1, state.accumulator / state.speed);

        for (var i = state.trail.length - 1; i >= 0; i--) {
          state.trail[i].life -= dt * 0.0035;
          if (state.trail[i].life <= 0) state.trail.splice(i, 1);
        }

        for (var p = state.particles.length - 1; p >= 0; p--) {
          var pt = state.particles[p];
          pt.x += pt.vx * dt * 0.06;
          pt.y += pt.vy * dt * 0.06;
          pt.vx *= 0.965;
          pt.vy *= 0.965;
          pt.life -= pt.decay * (dt * 0.06);
          if (pt.life <= 0) state.particles.splice(p, 1);
        }

        if (state.shakeT > 0) {
          state.shakeT -= dt * 0.002;
          if (state.shakeT < 0) state.shakeT = 0;
        }
      }

      var lastTime = performance.now();

      function loop(now) {
        var dt = Math.min(64, now - lastTime);
        lastTime = now;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }

      function setDirection(dx, dy) {
        if (!state.running || state.paused) return;
        if (state.dir.x === -dx && state.dir.y === -dy) return;
        if (state.dir.x === dx && state.dir.y === dy) return;
        state.nextDir = { x: dx, y: dy };
        playTurn();
      }

      function startGame() {
        resetGame();
        state.running = true;
        state.paused = false;
        state.lastStep = performance.now();
        state.accumulator = 0;
        hideOverlay();
        updateStatus();
        updateHUD();
        if (!state.audioCtx) {
          try {
            state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          } catch (e) {}
        }
        if (state.audioCtx && state.audioCtx.state === 'suspended') {
          state.audioCtx.resume();
        }
      }

      function togglePause() {
        if (!state.running || state.dead) return;
        state.paused = !state.paused;
        updateStatus();
        showToast(state.paused ? 'Paused' : 'Resumed');
      }

      function showOverlay(title, text, buttonLabel) {
        el.overlayTitle.textContent = title;
        el.overlayText.textContent = text;
        el.btnStart.textContent = buttonLabel || 'Engage';
        el.overlay.classList.remove('hidden');
      }

      function hideOverlay() {
        el.overlay.classList.add('hidden');
      }

      function showToast(text, warn) {
        el.toastText.textContent = text;
        el.toast.classList.toggle('warn', !!warn);
        el.toast.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(function () {
          el.toast.classList.remove('show');
        }, 1800);
      }

      function loadBest() {
        try {
          var b = parseInt(localStorage.getItem(STORAGE_BEST) || '0', 10);
          if (!isNaN(b)) state.best = b;
        } catch (e) {}
      }

      function bindEvents() {
        document.addEventListener('keydown', function (e) {
          var key = e.key.toLowerCase();
          if (['arrowup','arrowdown','arrowleft','arrowright',' ','w','a','s','d'].indexOf(key) !== -1) {
            if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
              e.preventDefault();
            }
          }

          if (key === 'arrowup' || key === 'w') setDirection(0, -1);
          else if (key === 'arrowdown' || key === 's') setDirection(0, 1);
          else if (key === 'arrowleft' || key === 'a') setDirection(-1, 0);
          else if (key === 'arrowright' || key === 'd') setDirection(1, 0);
          else if (key === 'p') togglePause();
          else if (key === 'r') {
            if (state.running && !state.dead) {
              if (!confirm('Restart the current run?')) return;
            }
            startGame();
          } else if (key === 'enter' || key === ' ') {
            if (!state.running || state.dead) {
              startGame();
            }
          }
        });

        el.btnStart.addEventListener('click', startGame);
        el.btnPause.addEventListener('click', togglePause);

        el.btnSound.addEventListener('click', function () {
          state.soundOn = !state.soundOn;
          el.btnSound.classList.toggle('off', !state.soundOn);
          el.soundBar.style.display = state.soundOn ? 'none' : 'block';
          el.soundIcon.innerHTML = state.soundOn
            ? '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/>'
            : '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM12 4v16l-5-5H3V9h4z"/>';
          showToast(state.soundOn ? 'Sound on' : 'Sound off');
        });

        el.difficulty.addEventListener('click', function (e) {
          var btn = e.target.closest('.diff-btn');
          if (!btn) return;
          var ms = parseInt(btn.dataset.speed, 10);
          state.speed = ms;
          el.difficulty.querySelectorAll('.diff-btn').forEach(function (b) {
            b.classList.toggle('on', b === btn);
          });
          updateHUD();
          showToast('Speed ' + ms + 'ms');
          if (state.running && !state.dead) {
            state.accumulator = 0;
          }
        });

        var touchStartX = 0, touchStartY = 0, touchActive = false;

        canvas.addEventListener('touchstart', function (e) {
          if (e.touches.length !== 1) return;
          touchActive = true;
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }, { passive: true });

        canvas.addEventListener('touchmove', function (e) {
          if (!touchActive) return;
          e.preventDefault();
          var dx = e.touches[0].clientX - touchStartX;
          var dy = e.touches[0].clientY - touchStartY;
          if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;

          if (Math.abs(dx) > Math.abs(dy)) {
            setDirection(dx > 0 ? 1 : -1, 0);
          } else {
            setDirection(0, dy > 0 ? 1 : -1);
          }
          touchActive = false;
        }, { passive: false });

        canvas.addEventListener('touchend', function () {
          touchActive = false;
        });

        window.addEventListener('resize', function () {
          setupCanvas();
        });

        document.addEventListener('visibilitychange', function () {
          if (document.hidden && state.running && !state.paused) {
            state.paused = true;
            updateStatus();
          }
        });
      }

      function init() {
        loadBest();
        setupCanvas();
        resetGame();
        updateStatus();
        el.statBest.textContent = state.best;
        el.statusBest.textContent = state.best;
        bindEvents();
        requestAnimationFrame(loop);
      }

      init();
    })();
  </script>
</body>
</html>
